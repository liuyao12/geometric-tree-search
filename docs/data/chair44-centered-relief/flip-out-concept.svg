<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Two ways to make Chair44 relief from movable pyramids</title>
<desc id="desc">Cross-section of a blue pyramid rotated half a turn around a base edge, leaving a matching recess. A second diagram shows a green pyramid plug transferred to a separate red face. These are conceptual mechanisms, not fabrication drawings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#526567" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="460" rx="12" fill="#f5f6f1"/>
<g font-family="system-ui,sans-serif" fill="#20302c">
<text x="36" y="44" font-size="24" font-weight="650">Flip out a chunk, or move it to another face</text>
<text x="36" y="73" font-size="15" fill="#61716a">Cross-sections through the pyramid tips · conceptual mechanisms</text>
<line x1="547" y1="106" x2="547" y2="380" stroke="#c7d2ca"/>
<text x="36" y="121" font-size="19" font-weight="600">Blue: hinge along a base edge</text>
<rect x="58" y="257" width="445" height="105" fill="#dce6df"/>
<path d="M100 257L185 321L270 257" fill="#f5f6f1" stroke="#526ca8" stroke-width="2"/>
<path d="M270 257L355 193L440 257Z" fill="#6380b9" fill-opacity=".65" stroke="#526ca8" stroke-width="2"/>
<path d="M58 257H100M440 257H503" stroke="#455a52" stroke-width="2"/>
<path d="M185 321A106 106 0 0 1 355 193" fill="none" stroke="#526567" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<circle cx="270" cy="257" r="5" fill="#20302c"/>
<text x="282" y="285" font-size="13">hinge edge</text>
<text x="100" y="346" font-size="14">vacated dent</text>
<text x="327" y="178" font-size="14">same chunk</text>
<text x="36" y="399" font-size="15">A half-turn makes the adjacent bump and dent.</text>
<text x="36" y="424" font-size="14" fill="#61716a">Lock the hinge in its final position.</text>
<text x="582" y="121" font-size="19" font-weight="600">Red / green: transfer a plug</text>
<rect x="581" y="257" width="208" height="105" fill="#dce6df"/>
<path d="M625 257L685 307L745 257" fill="#f5f6f1" stroke="#78a545" stroke-width="2"/>
<path d="M581 257H625M745 257H789" stroke="#455a52" stroke-width="2"/>
<rect x="850" y="257" width="208" height="105" fill="#dce6df"/>
<path d="M894 257L954 207L1014 257Z" fill="#d76a63" fill-opacity=".7" stroke="#b74b47" stroke-width="2"/>
<path d="M850 257H894M1014 257H1058" stroke="#455a52" stroke-width="2"/>
<path d="M686 230C701 143 905 139 943 186" fill="none" stroke="#526567" stroke-width="2" marker-end="url(#arrow)"/>
<text x="623" y="337" font-size="14">green face</text>
<text x="912" y="337" font-size="14">red face</text>
<text x="582" y="399" font-size="15">One face loses the chunk; the other gains it.</text>
<text x="582" y="424" font-size="14" fill="#61716a">Attach the plug firmly, with its orientation fixed.</text>
</g></svg>
