<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" role="img" aria-labelledby="title desc">
  <title id="title">One scoped palette lifetime</title>
  <desc id="desc">A schematic of the reviewed protocol. Full preparation and custody enclose repeated strict queries. Each receipt is retained before copying and delivery. A failure keeps separate production, copy and delivery observations. This is not a saved tiling or executed proof.</desc>
  <rect x="8" y="8" width="1064" height="274" rx="16" fill="#f0f4ed" stroke="#abc0ae"/>
  <text x="32" y="40" fill="#21473e" font-family="system-ui,sans-serif" font-size="18">Schematic protocol · full preparation per scope · complete inventory retained</text>
  <g fill="white" stroke="#b5c6bb" stroke-width="2">
    <rect x="32" y="67" width="180" height="124" rx="10"/>
    <rect x="242" y="67" width="182" height="124" rx="10"/>
    <rect x="454" y="67" width="182" height="124" rx="10"/>
    <rect x="666" y="67" width="170" height="124" rx="10"/>
    <rect x="866" y="67" width="182" height="124" rx="10"/>
  </g>
  <g fill="none" stroke-width="6">
    <path d="M48 82h148" stroke="#7e66b4"/>
    <path d="M258 82h150" stroke="#3485af"/>
    <path d="M470 82h150" stroke="#cc9240"/>
    <path d="M682 82h138" stroke="#429c83"/>
    <path d="M882 82h150" stroke="#7e66b4"/>
  </g>
  <g fill="#21473e" font-family="system-ui,sans-serif" text-anchor="middle" font-size="17">
    <text x="122" y="116">Prepare</text><text x="122" y="145">full descriptor</text><text x="122" y="171">entry custody</text>
    <text x="333" y="116">Query</text><text x="333" y="145">strict typed values</text><text x="333" y="171">graph charges</text>
    <text x="545" y="116">Produce</text><text x="545" y="145">retain raw receipt</text><text x="545" y="171">before copying</text>
    <text x="751" y="116">Copy + deliver</text><text x="751" y="145">exact preimage</text><text x="751" y="171">separate counts</text>
    <text x="957" y="116">Close</text><text x="957" y="145">full reconciliation</text><text x="957" y="171">exit custody</text>
  </g>
  <g stroke="#5c7d72" stroke-width="2.5"><path d="M216 128h20m192 0h20m192 0h20m180 0h20"/></g>
  <path d="M819 207v18H258v-18" fill="none" stroke="#3485af" stroke-width="2.5"/>
  <text x="538" y="253" text-anchor="middle" fill="#38594e" font-family="system-ui,sans-serif" font-size="17">Repeat every declared ordered request; retain the full lifetime for final evidence.</text>
</svg>
