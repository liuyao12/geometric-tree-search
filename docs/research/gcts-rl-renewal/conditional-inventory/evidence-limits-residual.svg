<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
  <title id="title">Sharing an equal residual decision</title>
  <desc id="desc">Schematic only: two byte prefixes with the same remaining depth and identical zero and one successors can use the same physical state. Blank and fence behavior must also agree. No generated state IDs or executed transitions are shown.</desc>
  <rect x="6" y="6" width="1028" height="318" rx="14" fill="#eff4ee" stroke="#b2c5b6"/>
  <g fill="white" stroke="#a6bcb1" stroke-width="2">
    <rect x="34" y="58" width="216" height="86" rx="8"/>
    <rect x="34" y="194" width="216" height="86" rx="8"/>
    <rect x="394" y="122" width="240" height="100" rx="8"/>
    <rect x="788" y="58" width="216" height="86" rx="8"/>
    <rect x="788" y="194" width="216" height="86" rx="8"/>
  </g>
  <g fill="none" stroke-width="3">
    <path d="M250 101L394 158M250 237L394 186" stroke="#8067ac"/>
    <path d="M634 158L788 101" stroke="#3985b1"/>
    <path d="M634 186L788 237" stroke="#30967b"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#21473f" font-size="19">
    <text x="520" y="36">Source design: equal-depth residual sharing</text>
    <text x="142" y="95">Prefix A</text><text x="142" y="124">same remaining depth</text>
    <text x="142" y="231">Prefix B</text><text x="142" y="260">same remaining depth</text>
    <text x="514" y="157">One shared state</text><text x="514" y="187">identical literal actions</text>
    <text x="896" y="95">Zero-bit successor</text><text x="896" y="124">same bit; move right</text>
    <text x="896" y="231">One-bit successor</text><text x="896" y="260">same bit; move right</text>
    <text x="520" y="309" font-size="16">Depth, blank behavior and capacity-fence behavior remain part of the correspondence.</text>
  </g>
</svg>
