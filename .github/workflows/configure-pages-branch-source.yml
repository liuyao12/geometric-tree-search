name: Configure Pages branch source

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Publish main/root through the branch builder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PUT \
            "repos/${GH_REPOSITORY}/pages" \
            --input - <<'JSON'
          {"build_type":"legacy","source":{"branch":"main","path":"/"}}
          JSON
          gh api --method POST "repos/${GH_REPOSITORY}/pages/builds"
