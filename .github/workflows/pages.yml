name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Deployment runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - gcts-pages-ephemeral

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ inputs.runner == 'gcts-pages-ephemeral' && fromJSON('["self-hosted", "gcts-pages-ephemeral"]') || 'ubuntu-latest' }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
