name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Deployment runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - gcts-pages-ephemeral

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ inputs.runner == 'gcts-pages-ephemeral' && fromJSON('["self-hosted", "gcts-pages-ephemeral"]') || 'ubuntu-latest' }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Provide gtar on the ephemeral macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v gtar >/dev/null 2>&1; then
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gtar" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          args=()
          for argument in "$@"; do
            case "$argument" in
              --hard-dereference) ;;
              --dereference) args+=("-L") ;;
              *) args+=("$argument") ;;
            esac
          done
          exec /usr/bin/tar "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/bin/gtar"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Upload the static repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
