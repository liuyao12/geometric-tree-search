name: Incidence cubes Lean
on:
  push:
    paths: ['apps/incidence-cubes/formal/**', '.github/workflows/incidence-cubes.yml']
  pull_request:
    paths: ['apps/incidence-cubes/formal/**', '.github/workflows/incidence-cubes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: apps/incidence-cubes/formal
          use-mathlib-cache: 'true'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Audit theorem dependencies
        working-directory: apps/incidence-cubes/formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee axiom-audit.txt
          if grep -E 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' axiom-audit.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: incidence-cubes-verification
          path: |
            apps/incidence-cubes/formal/axiom-audit.txt
            apps/incidence-cubes/formal/lake-manifest.json
