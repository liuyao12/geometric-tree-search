 if(mode==='samples'){
  const s=samples.find(q=>q.id===sampleInput.value);
  if(s.boards){for(const c of s.boards)add('board',new THREE.Matrix4().makeTranslation(...c),document.querySelector('#boardTransparent').checked);}
  else add('board',undefined,document.querySelector('#boardTransparent').checked);
  for(const [i,q] of s.tiles.entries()){const o=add(q.tile,matrix(q.matrix));if(s.interferingTiles?.includes(i))for(const edge of o.children)edge.material=interferenceMaterial;}
  for(const [i,m] of s.connectors.entries()){const o=add('connector',matrix(m));if(s.interferingConnectors?.includes(i))o.material=[interferenceFill,interferenceFill];}
  caption=!s.tiles.length?'Joined large-kagome boards · interleaving hexagon edges':s.interferingTiles?.length?`${s.label} · coral outlines mark ${s.interferingTiles.length} ${s.interferingTiles.length===1?'tile':'tiles'} with underside interference`:`${s.label} · seated on the board`;
 }else{
  const m=mode==='turtle'?new THREE.Matrix4().makeRotationZ(-2*Math.PI/3):undefined;
  add(mode,m,mode==='board'&&document.querySelector('#boardTransparent').checked);
  caption={turtle:'One turtle · rotate to see either face',trefoil:'One trefoil · triangle on the reverse · rotate to see the three stripes',connector:'One tile connector · rotate to see the sockets',board:'Large kagome hexagons · interleaving edges · solid underside'}[mode];
 }
 document.querySelector('#caption').textContent=caption;resize();fit();
 if(mode==='samples'&&sampleInput.value==='large-hexagons-fit'){group.rotation.x=Math.PI;update();}
}
function update(){camera.position.set(0,-distance*.48,distance*.88);camera.lookAt(0,0,0);renderer.render(scene,camera);}
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();update();}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{mode=b.dataset.view;show();};sampleInput.onchange=show;document.querySelector('#boardTransparent').onchange=show;document.querySelector('#reset').onclick=show;addEventListener('resize',()=>{resize();fit();if(mode==='samples'&&sampleInput.value==='large-hexagons-fit'){group.rotation.x=Math.PI;update();}});let dragging=false,last;
renderer.domElement.onpointerdown=e=>{dragging=true;last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!dragging)return;group.rotation.z+=(e.clientX-last[0])*.008;group.rotation.x+=(e.clientY-last[1])*.008;last=[e.clientX,e.clientY];update();};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onwheel=e=>{e.preventDefault();distance=Math.max(initialDistance*.2,Math.min(initialDistance*3,distance*Math.exp(e.deltaY*.001)));update();};show();
</script></body></html>
