<text x="14" y="226" font-size="3.4" font-weight="600">Assembly</text><text x="14" y="233" font-size="3">Seat the rotor in the open corner bay; align hubs and insert the axle.</text><text x="14" y="239" font-size="3">Check motion before fixing the axle or locking the folded position.</text><text x="14" y="245" font-size="3">Printer fit is untested. Adjust the editable CAD clearances to your process.</text>
<text x="14" y="258" font-size="3.1" font-weight="600">This is a mechanism coupon, not a verified monotile.</text><text x="14" y="264" font-size="2.9">Curved relief, hinge hardware, gaps, and concave-corner adaptation need separate tiling checks.</text>
