<text x="90" y="178" font-size="3">Cavity spans 11.70 to 28.30 along the axle.</text><text x="90" y="185" font-size="3">Rotor spans 12.00 to 28.00; end clearance 0.30.</text><text x="90" y="192" font-size="3">Rotor hubs: radius 2.50, length 2.00 at each end.</text><text x="90" y="199" font-size="3">Housing bearings: radius 3.50, length 3.00.</text><text x="90" y="206" font-size="3">Straight axle: diameter 2.00, length 44.00.</text>
