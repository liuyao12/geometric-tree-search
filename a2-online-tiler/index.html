<!doctype html>
<html lang="en">
<head>
  <base href="../apps/a2-online-tiler/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hat &amp; Turtle · A2 Online Tiler</title>
  <link rel="stylesheet" href="./companions.css">
</head>
<body>
<header><a class="home" href="../../">GCTS</a><span class="divider"></span><span>Online tiler</span><a class="editor" href="./polygon.html">Polygon editor ↗</a></header>
<main>
  <aside>
    <h1>Hat &amp; Turtle</h1>
    <p class="intro">Choose pieces and grow a patch on their shared kite grid.</p>
    <fieldset><legend>Tile set</legend><div id="picker"></div></fieldset>
    <fieldset><legend>Search</legend><div class="switch">
      <label><input type="radio" name="mode" value="base" checked>Base GCTS</label>
      <label><input type="radio" name="mode" value="learn">Learn as you go</label>
    </div>
    <p id="modeInfo" class="hint">Uses the unmarked point values.</p></fieldset>
    <label class="field">Starting tile<select id="first"></select></label>
    <div class="fields"><label class="field">Board radius<select id="radius"><option value="1">1 ring</option><option value="2" selected>2 rings</option><option value="3">3 rings</option><option value="4">4 rings</option></select></label>
    <label class="field">Random seed<input id="seed" type="number" value="6" min="0" max="4294967295" step="1" required></label></div>
    <label class="marks"><input id="showMarks" type="checkbox" checked> Show learned markings</label>
    <div class="actions"><button id="run">Run search</button><button id="stop" disabled>Stop</button></div>
  </aside>
  <section class="workbench" aria-label="Tiling experiment">
    <div class="boardhead"><h2>Search board</h2><span id="status" role="status">Ready</span></div>
    <svg id="board" viewBox="0 0 750 550" role="img" aria-label="Tile placements and the target boundary"></svg>
    <div class="caption"><span><i></i> Target boundary</span><span id="markLegend" hidden>Blue positive · Red negative</span><span id="progress"></span></div>
    <div class="metrics">
      <div><span>Tiles</span><b id="count">0</b></div><div><span>Placement attempts</span><b id="nodes">0</b></div>
      <div><span>Backtracks</span><b id="backtracks">0</b></div><div><span>Signed values</span><b id="marks">0</b></div>
    </div>
    <p class="hint" id="comparison" aria-live="polite"></p>
  </section>
</main>
<script type="module" src="./companion-app.js"></script>
</body>
</html>
